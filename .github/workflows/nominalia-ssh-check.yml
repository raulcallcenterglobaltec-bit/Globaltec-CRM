name: Comprobar SSH Nominalia

on:
  push:
    paths:
      - '.github/workflows/nominalia-ssh-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Instalar cliente SSH con contraseña
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verificar conexión de solo lectura
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo 'ERROR: falta NOMINALIA_SSH_PASSWORD'
            exit 1
          fi
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=15 \
            -o NumberOfPasswordPrompts=1 \
            grupoglobalteces@grupyj.ssh.tb-hosting.com \
            'printf "SSH_OK\n"; pwd; if test -d subsites/crm.grupoglobaltec.es; then echo "CRM_PATH_OK"; elif test -d www/subsites/crm.grupoglobaltec.es; then echo "CRM_PATH_IN_WWW"; else echo "CRM_PATH_NOT_FOUND"; fi'
