name: Publicar Marketing en CRM real

on:
  push:
    branches: ["main"]
    paths:
      - "marketing-live/**"
      - ".github/workflows/marketing-live-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globaltec-marketing-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar archivos del módulo
        run: |
          test -s marketing-live/marketing.html
          test -s marketing-live/assets/marketing.js
          test -s marketing-live/assets/marketing.css
          test -s marketing-live/assets/marketing-link.js
          test -s marketing-live/informes-comerciales.html
          test -s marketing-live/assets/informes-comerciales.js
          test -s marketing-live/assets/informes-comerciales.css
          test -s marketing-live/assets/contact-actions-live.js
          test -s marketing-live/assets/inicio-prioridades-live.js
          test -s marketing-live/assets/export-clientes-contactos-live.js
          test -s marketing-live/assets/agenda-rapida-live.js
          test -s marketing-live/assets/cliente-seguimiento-live.js
          test -s marketing-live/assets/organizacion-global-live.js
          test -s marketing-live/assets/conversion-cliente-live.js
          test -s marketing-live/assets/calidad-datos-live.js
          test -s marketing-live/assets/oportunidades-panel-live.js
          test -s marketing-live/assets/leads-seguimiento-live.js
          test -s marketing-live/assets/diseno-unificado-live.css
          node --check marketing-live/assets/marketing.js
          node --check marketing-live/assets/marketing-link.js
          node --check marketing-live/assets/informes-comerciales.js
          node --check marketing-live/assets/tasks-delete-live.js
          node --check marketing-live/assets/contact-actions-live.js
          node --check marketing-live/assets/inicio-prioridades-live.js
          node --check marketing-live/assets/export-clientes-contactos-live.js
          node --check marketing-live/assets/agenda-rapida-live.js
          node --check marketing-live/assets/cliente-seguimiento-live.js
          node --check marketing-live/assets/organizacion-global-live.js
          node --check marketing-live/assets/conversion-cliente-live.js
          node --check marketing-live/assets/calidad-datos-live.js
          node --check marketing-live/assets/oportunidades-panel-live.js
          node --check marketing-live/assets/leads-seguimiento-live.js
      - name: Preparar conexión
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
      - name: Respaldar archivos anteriores
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            grupoglobalteces@grupyj.ssh.tb-hosting.com \
            "set -eu
              cd /data/sites/web/grupoglobalteces
              WEB=subsites/crm.grupoglobaltec.es
              test -s \"\$WEB/index.html\"
              test -f \"\$WEB/.htaccess\"
              BACK=.crm-backups/marketing-${GITHUB_RUN_ID}
              mkdir -p \"\$BACK/assets\"
              cp -p \"\$WEB/index.html\" \"\$BACK/index.html\"
              for FILE in marketing.html informes-comerciales.html assets/marketing.js assets/marketing.css assets/marketing-link.js assets/tasks-delete-live.js assets/informes-comerciales.js assets/informes-comerciales.css assets/contact-actions-live.js assets/inicio-prioridades-live.js assets/export-clientes-contactos-live.js assets/agenda-rapida-live.js assets/cliente-seguimiento-live.js assets/organizacion-global-live.js assets/conversion-cliente-live.js assets/calidad-datos-live.js assets/oportunidades-panel-live.js assets/leads-seguimiento-live.js assets/diseno-unificado-live.css; do
                if test -f \"\$WEB/\$FILE\"; then
                  cp -p \"\$WEB/\$FILE\" \"\$BACK/\$FILE\"
                fi
              done
              test -s \"\$BACK/index.html\"
              echo BACKUP_OK
            "
      - name: Subir solamente el módulo Marketing
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_HOST=grupoglobalteces@grupyj.ssh.tb-hosting.com
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20'
          TARGET=subsites/crm.grupoglobaltec.es
          sshpass -e rsync -az -e "ssh $SSH_OPTS" marketing-live/assets/marketing.js marketing-live/assets/marketing.css marketing-live/assets/marketing-link.js marketing-live/assets/tasks-delete-live.js marketing-live/assets/informes-comerciales.js marketing-live/assets/informes-comerciales.css marketing-live/assets/contact-actions-live.js marketing-live/assets/inicio-prioridades-live.js marketing-live/assets/export-clientes-contactos-live.js marketing-live/assets/agenda-rapida-live.js marketing-live/assets/cliente-seguimiento-live.js marketing-live/assets/organizacion-global-live.js marketing-live/assets/conversion-cliente-live.js marketing-live/assets/calidad-datos-live.js marketing-live/assets/oportunidades-panel-live.js marketing-live/assets/leads-seguimiento-live.js marketing-live/assets/diseno-unificado-live.css "$SSH_HOST:$TARGET/assets/"
          sshpass -e rsync -az -e "ssh $SSH_OPTS" marketing-live/marketing.html marketing-live/informes-comerciales.html "$SSH_HOST:$TARGET/"
          sshpass -e ssh -T $SSH_OPTS "$SSH_HOST" '
            set -eu
            cd subsites/crm.grupoglobaltec.es
            test -s marketing.html
            test -s assets/marketing.js
            test -s assets/marketing-link.js
            test -s informes-comerciales.html
            test -s assets/informes-comerciales.js
            test -s assets/contact-actions-live.js
            test -s assets/inicio-prioridades-live.js
            test -s assets/export-clientes-contactos-live.js
            test -s assets/agenda-rapida-live.js
            test -s assets/cliente-seguimiento-live.js
            test -s assets/organizacion-global-live.js
            test -s assets/conversion-cliente-live.js
            test -s assets/calidad-datos-live.js
            test -s assets/oportunidades-panel-live.js
            test -s assets/leads-seguimiento-live.js
            test -s assets/diseno-unificado-live.css
            if ! grep -q "/assets/marketing-link.js" index.html; then
              grep -q "</body>" index.html
              sed "s@</body>@  <script defer src=\"/assets/marketing-link.js\"></script></body>@" index.html > index.html.marketing-next
              grep -q "/assets/marketing-link.js" index.html.marketing-next
              mv index.html.marketing-next index.html
            fi
            if ! grep -q "/assets/tasks-delete-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/tasks-delete-live.js\"></script></body>@" index.html > index.html.tasks-next
              grep -q "/assets/tasks-delete-live.js" index.html.tasks-next
              mv index.html.tasks-next index.html
            fi
            if ! grep -q "/assets/contact-actions-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/contact-actions-live.js\"></script></body>@" index.html > index.html.contact-next
              grep -q "/assets/contact-actions-live.js" index.html.contact-next
              mv index.html.contact-next index.html
            fi
            if ! grep -q "/assets/inicio-prioridades-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/inicio-prioridades-live.js\"></script></body>@" index.html > index.html.inicio-next
              grep -q "/assets/inicio-prioridades-live.js" index.html.inicio-next
              mv index.html.inicio-next index.html
            fi
            if ! grep -q "/assets/export-clientes-contactos-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/export-clientes-contactos-live.js\"></script></body>@" index.html > index.html.export-next
              grep -q "/assets/export-clientes-contactos-live.js" index.html.export-next
              mv index.html.export-next index.html
            fi
            if ! grep -q "/assets/agenda-rapida-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/agenda-rapida-live.js\"></script></body>@" index.html > index.html.agenda-next
              grep -q "/assets/agenda-rapida-live.js" index.html.agenda-next
              mv index.html.agenda-next index.html
            fi
            if ! grep -q "/assets/cliente-seguimiento-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/cliente-seguimiento-live.js\"></script></body>@" index.html > index.html.history-next
              grep -q "/assets/cliente-seguimiento-live.js" index.html.history-next
              mv index.html.history-next index.html
            fi
            if ! grep -q "/assets/organizacion-global-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/organizacion-global-live.js\"></script></body>@" index.html > index.html.org-next
              grep -q "/assets/organizacion-global-live.js" index.html.org-next
              mv index.html.org-next index.html
            fi
            if ! grep -q "/assets/conversion-cliente-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/conversion-cliente-live.js\"></script></body>@" index.html > index.html.convert-next
              grep -q "/assets/conversion-cliente-live.js" index.html.convert-next
              mv index.html.convert-next index.html
            fi
            if ! grep -q "/assets/calidad-datos-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/calidad-datos-live.js\"></script></body>@" index.html > index.html.quality-next
              grep -q "/assets/calidad-datos-live.js" index.html.quality-next
              mv index.html.quality-next index.html
            fi
            if ! grep -q "/assets/oportunidades-panel-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/oportunidades-panel-live.js\"></script></body>@" index.html > index.html.opp-panel-next
              grep -q "/assets/oportunidades-panel-live.js" index.html.opp-panel-next
              mv index.html.opp-panel-next index.html
            fi
            if ! grep -q "/assets/leads-seguimiento-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/leads-seguimiento-live.js\"></script></body>@" index.html > index.html.leads-panel-next
              grep -q "/assets/leads-seguimiento-live.js" index.html.leads-panel-next
              mv index.html.leads-panel-next index.html
            fi
            if ! grep -q "/assets/diseno-unificado-live.css" index.html; then
              grep -q "</head>" index.html
              sed "s@</head>@  <link rel=\"stylesheet\" href=\"/assets/diseno-unificado-live.css\"></head>@" index.html > index.html.design-next
              grep -q "/assets/diseno-unificado-live.css" index.html.design-next
              mv index.html.design-next index.html
            fi
            echo MARKETING_FILES_OK
          '
      - name: Renovar versiones de los paneles en la pagina principal
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            grupoglobalteces@grupyj.ssh.tb-hosting.com \
            "BUILD_SHA=${GITHUB_SHA} sh -s" <<'REMOTE'
          set -eu
          cd subsites/crm.grupoglobaltec.es
          test -s index.html
          for asset in oportunidades-panel-live.js leads-seguimiento-live.js agenda-rapida-live.js cliente-seguimiento-live.js contact-actions-live.js calidad-datos-live.js; do
            sed -E "s#(/assets/${asset})(\\?v=[a-f0-9]+)?\"#\\1?v=${BUILD_SHA}\"#g" index.html > index.html.version-next
            mv index.html.version-next index.html
            grep -q "/assets/${asset}?v=${BUILD_SHA}" index.html
          done
          echo PANEL_VERSIONS_OK
          REMOTE
      - name: Comprobar publicación real por HTTPS
        run: |
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/marketing.html | grep -q 'Calendario editorial'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/marketing.js | grep -q 'crm_marketing_posts'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/marketing-link.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/tasks-delete-live.js | grep -q 'crm-tasks-manage-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/informes-comerciales.html | grep -q 'Rendimiento por responsable'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/informes-comerciales.js | grep -q 'metric-converted'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/contact-actions-live.js | grep -q 'crm-contact-quick-group'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/contact-actions-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/inicio-prioridades-live.js | grep -q 'crm-priorities-panel'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/inicio-prioridades-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/export-clientes-contactos-live.js | grep -q 'crm-export-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/export-clientes-contactos-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/agenda-rapida-live.js | grep -q 'crm-agenda-manage-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/agenda-rapida-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/cliente-seguimiento-live.js | grep -q 'crm-client-history-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/cliente-seguimiento-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/organizacion-global-live.js | grep -q 'crm-active-organization'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/organizacion-global-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/conversion-cliente-live.js | grep -q 'crm-convert-client-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/conversion-cliente-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/calidad-datos-live.js | grep -q 'crm-quality-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/calidad-datos-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/oportunidades-panel-live.js | grep -q 'crm-opp-dashboard-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/oportunidades-panel-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/leads-seguimiento-live.js | grep -q 'crm-lead-summary-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/leads-seguimiento-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q "/assets/oportunidades-panel-live.js?v=${GITHUB_SHA}"
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/tasks-delete-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/diseno-unificado-live.css | grep -q 'Globaltec CRM'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/diseno-unificado-live.css'
          echo MARKETING_LIVE_OK
