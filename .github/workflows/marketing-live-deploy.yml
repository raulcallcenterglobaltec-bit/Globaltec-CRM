name: Publicar Marketing en CRM real

on:
  push:
    branches: ["main"]
    paths:
      - "marketing-live/**"
      - ".github/workflows/marketing-live-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globaltec-marketing-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar archivos del módulo
        run: |
          test -s marketing-live/marketing.html
          test -s marketing-live/assets/marketing.js
          test -s marketing-live/assets/marketing.css
          test -s marketing-live/assets/marketing-link.js
          test -s marketing-live/informes-comerciales.html
          test -s marketing-live/assets/informes-comerciales.js
          test -s marketing-live/assets/informes-comerciales.css
          test -s marketing-live/assets/contact-actions-live.js
          test -s marketing-live/assets/inicio-prioridades-live.js
          test -s marketing-live/assets/export-clientes-contactos-live.js
          test -s marketing-live/assets/agenda-rapida-live.js
          node --check marketing-live/assets/marketing.js
          node --check marketing-live/assets/marketing-link.js
          node --check marketing-live/assets/informes-comerciales.js
          node --check marketing-live/assets/tasks-delete-live.js
          node --check marketing-live/assets/contact-actions-live.js
          node --check marketing-live/assets/inicio-prioridades-live.js
          node --check marketing-live/assets/export-clientes-contactos-live.js
          node --check marketing-live/assets/agenda-rapida-live.js
      - name: Preparar conexión
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
      - name: Respaldar archivos anteriores
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            grupoglobalteces@grupyj.ssh.tb-hosting.com \
            "set -eu
              cd /data/sites/web/grupoglobalteces
              WEB=subsites/crm.grupoglobaltec.es
              test -s \"\$WEB/index.html\"
              test -f \"\$WEB/.htaccess\"
              BACK=.crm-backups/marketing-${GITHUB_RUN_ID}
              mkdir -p \"\$BACK/assets\"
              cp -p \"\$WEB/index.html\" \"\$BACK/index.html\"
              for FILE in marketing.html informes-comerciales.html assets/marketing.js assets/marketing.css assets/marketing-link.js assets/tasks-delete-live.js assets/informes-comerciales.js assets/informes-comerciales.css assets/contact-actions-live.js assets/inicio-prioridades-live.js assets/export-clientes-contactos-live.js assets/agenda-rapida-live.js; do
                if test -f \"\$WEB/\$FILE\"; then
                  cp -p \"\$WEB/\$FILE\" \"\$BACK/\$FILE\"
                fi
              done
              test -s \"\$BACK/index.html\"
              echo BACKUP_OK
            "
      - name: Subir solamente el módulo Marketing
        env:
          SSHPASS: ${{ secrets.NOMINALIA_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_HOST=grupoglobalteces@grupyj.ssh.tb-hosting.com
          SSH_OPTS='-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20'
          TARGET=subsites/crm.grupoglobaltec.es
          sshpass -e rsync -az -e "ssh $SSH_OPTS" marketing-live/assets/marketing.js marketing-live/assets/marketing.css marketing-live/assets/marketing-link.js marketing-live/assets/tasks-delete-live.js marketing-live/assets/informes-comerciales.js marketing-live/assets/informes-comerciales.css marketing-live/assets/contact-actions-live.js marketing-live/assets/inicio-prioridades-live.js marketing-live/assets/export-clientes-contactos-live.js marketing-live/assets/agenda-rapida-live.js "$SSH_HOST:$TARGET/assets/"
          sshpass -e rsync -az -e "ssh $SSH_OPTS" marketing-live/marketing.html marketing-live/informes-comerciales.html "$SSH_HOST:$TARGET/"
          sshpass -e ssh -T $SSH_OPTS "$SSH_HOST" '
            set -eu
            cd subsites/crm.grupoglobaltec.es
            test -s marketing.html
            test -s assets/marketing.js
            test -s assets/marketing-link.js
            test -s informes-comerciales.html
            test -s assets/informes-comerciales.js
            test -s assets/contact-actions-live.js
            test -s assets/inicio-prioridades-live.js
            test -s assets/export-clientes-contactos-live.js
            test -s assets/agenda-rapida-live.js
            if ! grep -q "/assets/marketing-link.js" index.html; then
              grep -q "</body>" index.html
              sed "s@</body>@  <script defer src=\"/assets/marketing-link.js\"></script></body>@" index.html > index.html.marketing-next
              grep -q "/assets/marketing-link.js" index.html.marketing-next
              mv index.html.marketing-next index.html
            fi
            if ! grep -q "/assets/tasks-delete-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/tasks-delete-live.js\"></script></body>@" index.html > index.html.tasks-next
              grep -q "/assets/tasks-delete-live.js" index.html.tasks-next
              mv index.html.tasks-next index.html
            fi
            if ! grep -q "/assets/contact-actions-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/contact-actions-live.js\"></script></body>@" index.html > index.html.contact-next
              grep -q "/assets/contact-actions-live.js" index.html.contact-next
              mv index.html.contact-next index.html
            fi
            if ! grep -q "/assets/inicio-prioridades-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/inicio-prioridades-live.js\"></script></body>@" index.html > index.html.inicio-next
              grep -q "/assets/inicio-prioridades-live.js" index.html.inicio-next
              mv index.html.inicio-next index.html
            fi
            if ! grep -q "/assets/export-clientes-contactos-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/export-clientes-contactos-live.js\"></script></body>@" index.html > index.html.export-next
              grep -q "/assets/export-clientes-contactos-live.js" index.html.export-next
              mv index.html.export-next index.html
            fi
            if ! grep -q "/assets/agenda-rapida-live.js" index.html; then
              sed "s@</body>@  <script defer src=\"/assets/agenda-rapida-live.js\"></script></body>@" index.html > index.html.agenda-next
              grep -q "/assets/agenda-rapida-live.js" index.html.agenda-next
              mv index.html.agenda-next index.html
            fi
            echo MARKETING_FILES_OK
          '
      - name: Comprobar publicación real por HTTPS
        run: |
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/marketing.html | grep -q 'Calendario editorial'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/marketing.js | grep -q 'crm_marketing_posts'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/marketing-link.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/tasks-delete-live.js | grep -q 'crm-tasks-manage-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/informes-comerciales.html | grep -q 'Rendimiento por responsable'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/informes-comerciales.js | grep -q 'metric-converted'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/contact-actions-live.js | grep -q 'crm-contact-quick-group'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/contact-actions-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/inicio-prioridades-live.js | grep -q 'Prioridades de hoy'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/inicio-prioridades-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/export-clientes-contactos-live.js | grep -q 'crm-export-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/export-clientes-contactos-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/assets/agenda-rapida-live.js | grep -q 'crm-agenda-manage-button'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/agenda-rapida-live.js'
          curl -fsSL --retry 4 --retry-delay 2 https://crm.grupoglobaltec.es/ | grep -q '/assets/tasks-delete-live.js'
          echo MARKETING_LIVE_OK
